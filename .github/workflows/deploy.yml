name: Deploy city sites

# One job per city folder under cities/: build the site for that city, deploy its CDK stack
# (S3 + CloudFront + Route 53), sync the build, invalidate, and curl the domain.
# The shared Snaphomz GitHub OIDC role only trusts the main branch, so this runs on main.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      city:
        description: "City slug to deploy (blank = every city)"
        required: false
        default: ""

concurrency:
  group: deploy-cities
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "22"

jobs:
  cities:
    name: List cities
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read cities/*/city.json
        id: list
        env:
          ONLY: ${{ github.event.inputs.city }}
        run: |
          if [ -n "$ONLY" ]; then
            test -f "cities/$ONLY/city.json" || { echo "::error::no cities/$ONLY/city.json"; exit 1; }
            MATRIX=$(jq -cn --arg c "$ONLY" '[$c]')
          else
            MATRIX=$(ls cities/*/city.json | xargs -n1 dirname | xargs -n1 basename | jq -R . | jq -cs .)
          fi
          echo "cities: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.city }}
    runs-on: ubuntu-latest
    needs: cities
    strategy:
      fail-fast: false
      matrix:
        city: ${{ fromJson(needs.cities.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    env:
      VITE_CITY: ${{ matrix.city }}
      CITY: ${{ matrix.city }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Read city config
        id: city
        run: |
          DOMAIN=$(jq -r .domain "cities/$CITY/city.json")
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "stack=SiteStack-$CITY" >> "$GITHUB_OUTPUT"
          echo "deploying $CITY to https://$DOMAIN"

      - name: Install
        run: npm ci

      - name: Build
        # Without the key the site still builds; the Google 3D look-around is simply absent.
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_KEY" ]; then
            echo "::warning::VITE_GOOGLE_MAPS_KEY secret is not set; building without the Google 3D look-around."
          fi
          npm run build
          test -f dist/data/index.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::075502422618:role/SnaphomzGitHubOIDCRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install CDK
        working-directory: cdk
        run: npm install

      - name: CDK bootstrap (no-op when already bootstrapped)
        working-directory: cdk
        run: npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }} || true

      - name: CDK deploy
        working-directory: cdk
        run: npx cdk deploy ${{ steps.city.outputs.stack }} -c city=$CITY --require-approval never

      - name: Read stack outputs
        id: outputs
        env:
          STACK_NAME: ${{ steps.city.outputs.stack }}
        run: |
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?Description=='CloudFront distribution ID'].OutputValue" --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?Description=='S3 bucket for static site'].OutputValue" --output text)
          test -n "$DIST_ID" && test -n "$BUCKET"
          echo "distribution_id=${DIST_ID}" >> "$GITHUB_OUTPUT"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          # Hashed assets are immutable; index.html and the data files are not hashed and must revalidate.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" --exclude "*.json"
          aws s3 sync dist/ "s3://$BUCKET/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" --include "index.html" --include "*.json"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.outputs.outputs.distribution_id }} --paths "/*"

      - name: Check the site answers
        env:
          SITE_URL: https://${{ steps.city.outputs.domain }}
        run: |
          sleep 45
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/" || echo "000")
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "live at $SITE_URL (commit ${{ github.sha }})"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::$SITE_URL did not return 200 yet; DNS or the certificate may still be propagating."
