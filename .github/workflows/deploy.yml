name: Deploy la.snaphomz.com

# Builds the static site and publishes it to S3 + CloudFront through the CDK stack in cdk/.
# The shared Snaphomz GitHub OIDC role only trusts the main branch, so this runs on main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-la
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "22"
  STACK_NAME: LaSiteStack
  SITE_URL: https://la.snaphomz.com

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Without the key the site still builds; the Google 3D look-around is simply absent.
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_KEY" ]; then
            echo "::warning::VITE_GOOGLE_MAPS_KEY secret is not set; building without the Google 3D look-around."
          fi
          npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    outputs:
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
      bucket: ${{ steps.outputs.outputs.bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::075502422618:role/SnaphomzGitHubOIDCRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install CDK
        working-directory: cdk
        run: npm install

      - name: CDK bootstrap (no-op when already bootstrapped)
        working-directory: cdk
        run: npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }} || true

      - name: CDK deploy
        working-directory: cdk
        run: npx cdk deploy ${{ env.STACK_NAME }} --require-approval never

      - name: Read stack outputs
        id: outputs
        run: |
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?Description=='CloudFront distribution ID'].OutputValue" --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?Description=='S3 bucket for static site'].OutputValue" --output text)
          test -n "$DIST_ID" && test -n "$BUCKET"
          echo "distribution_id=${DIST_ID}" >> "$GITHUB_OUTPUT"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    needs: infrastructure
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::075502422618:role/SnaphomzGitHubOIDCRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sync to S3
        env:
          BUCKET: ${{ needs.infrastructure.outputs.bucket }}
        run: |
          # Hashed assets are immutable; index.html and the data files are not hashed and must revalidate.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" --exclude "*.json"
          aws s3 sync dist/ "s3://$BUCKET/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" --include "index.html" --include "*.json"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ needs.infrastructure.outputs.distribution_id }} --paths "/*"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Check the site answers
        run: |
          sleep 45
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/" || echo "000")
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "live at $SITE_URL (commit ${{ github.sha }})"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::$SITE_URL did not return 200 yet; DNS or the certificate may still be propagating."
